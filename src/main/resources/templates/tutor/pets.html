<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Meus pets')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main class="conteudo">
    <div th:replace="~{fragments :: mensagens}"></div>

    <div class="titulo-pagina">
        <div>
            <h1>Meus pets</h1>
            <p class="subtitulo">Abra a carteira de cada pet para ver o que está em dia e o que precisa de atenção.</p>
        </div>
        <a class="botao" th:href="@{/tutor/pets/novo}">Cadastrar pet</a>
    </div>

    <p class="vazio" th:if="${pets.isEmpty()}">Você ainda não cadastrou nenhum pet.</p>
    <div class="tabela" th:unless="${pets.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Espécie</th>
                <th>Raça</th>
                <th>Fase de vida</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pet : ${pets}">
                <td><a th:href="@{/tutor/pets/{id}(id=${pet.id})}" th:text="${pet.nome}">Thor</a></td>
                <td th:text="${pet.especie.descricao}">Cão</td>
                <td th:text="${pet.raca}">SRD</td>
                <td th:text="${pet.faseVida.descricao}">Adulto</td>
                <td class="acoes">
                    <a class="botao" th:href="@{/tutor/pets/{id}(id=${pet.id})}">Carteira</a>
                    <a class="botao botao-secundario" th:href="@{/tutor/pets/{id}/editar(id=${pet.id})}">Editar</a>
                    <form method="post" th:action="@{/tutor/pets/{id}/excluir(id=${pet.id})}"
                          onsubmit="return confirm('Excluir este pet e todo o histórico dele?')">
                        <button type="submit" class="botao botao-perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
