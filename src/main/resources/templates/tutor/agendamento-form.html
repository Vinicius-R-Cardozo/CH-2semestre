<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Solicitar agendamento')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main class="conteudo">
    <div class="titulo-pagina">
        <div>
            <h1>Solicitar agendamento</h1>
            <p class="subtitulo">A clínica analisa o pedido e confirma a data.</p>
        </div>
    </div>

    <p class="vazio" th:if="${pets.isEmpty()}">
        Cadastre um pet antes de solicitar um agendamento.
        <a th:href="@{/tutor/pets/novo}">Cadastrar pet</a>
    </p>

    <form class="formulario" method="post" th:unless="${pets.isEmpty()}"
          th:action="@{/tutor/agendamentos}" th:object="${agendamentoForm}">
        <p class="aviso aviso-erro" th:each="erroGlobal : ${#fields.globalErrors()}" th:text="${erroGlobal}"></p>

        <label for="petId">Pet</label>
        <select th:field="*{petId}" th:errorclass="campo-invalido">
            <option value="">Selecione</option>
            <option th:each="pet : ${pets}" th:value="${pet.id}" th:text="${pet.nome}">Thor</option>
        </select>
        <p class="erro-campo" th:errors="*{petId}"></p>

        <label for="tipo">Cuidado</label>
        <select th:field="*{tipo}" th:errorclass="campo-invalido">
            <option value="">Selecione</option>
            <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo.descricao}">Vacinação</option>
        </select>
        <p class="erro-campo" th:errors="*{tipo}"></p>

        <label for="data">Data desejada</label>
        <input type="date" th:field="*{data}" th:errorclass="campo-invalido">
        <p class="erro-campo" th:errors="*{data}"></p>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Enviar solicitação</button>
            <a class="botao botao-secundario" th:href="@{/tutor/agendamentos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
