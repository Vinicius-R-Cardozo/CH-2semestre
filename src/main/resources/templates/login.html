<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Entrar')}"></head>
<body class="pagina-login">
<main class="cartao-login">
    <h1 class="marca">Clyvo Vet</h1>
    <p class="subtitulo">Acompanhamento contínuo da saúde do seu pet.</p>

    <p class="aviso aviso-erro" th:if="${param.error}">E-mail ou senha inválidos.</p>
    <p class="aviso aviso-sucesso" th:if="${param.logout}">Você saiu do sistema.</p>

    <form class="formulario" th:action="@{/login}" method="post">
        <label for="username">E-mail</label>
        <input type="email" id="username" name="username" autocomplete="username" autofocus>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password">

        <div class="acoes-formulario">
            <button type="submit" class="botao">Entrar</button>
        </div>
    </form>
</main>
</body>
</html>
