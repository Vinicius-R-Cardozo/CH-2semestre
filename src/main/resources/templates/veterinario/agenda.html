<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Agenda da clínica')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main class="conteudo">
    <div th:replace="~{fragments :: mensagens}"></div>

    <div class="titulo-pagina">
        <div>
            <h1>Agenda da clínica</h1>
            <p class="subtitulo">Confirme as solicitações dos tutores e registre os atendimentos realizados.</p>
        </div>
    </div>

    <p class="vazio" th:if="${agendamentos.isEmpty()}">Nenhum agendamento em aberto.</p>
    <div class="tabela" th:unless="${agendamentos.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Pet</th>
                <th>Tutor</th>
                <th>Cuidado</th>
                <th>Situação</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="agendamento : ${agendamentos}">
                <td th:text="${#temporals.format(agendamento.data, 'dd/MM/yyyy')}">01/01/2026</td>
                <td><a th:href="@{/veterinario/pets/{id}(id=${agendamento.pet.id})}" th:text="${agendamento.pet.nome}">Thor</a></td>
                <td th:text="${agendamento.pet.tutor.nome}">Tutor</td>
                <td th:text="${agendamento.tipo.descricao}">Vacinação</td>
                <td><span th:replace="~{fragments :: selo(${agendamento.status})}"></span></td>
                <td class="acoes">
                    <th:block th:if="${agendamento.aguardaConfirmacao()}">
                        <form method="post" th:action="@{/veterinario/agendamentos/{id}/confirmar(id=${agendamento.id})}">
                            <button type="submit" class="botao">Confirmar</button>
                        </form>
                        <form method="post" th:action="@{/veterinario/agendamentos/{id}/recusar(id=${agendamento.id})}"
                              onsubmit="return confirm('Recusar esta solicitação?')">
                            <button type="submit" class="botao botao-perigo">Recusar</button>
                        </form>
                    </th:block>
                    <a class="botao" th:if="${agendamento.podeSerConcluido()}"
                       th:href="@{/veterinario/agendamentos/{id}/concluir(id=${agendamento.id})}">Registrar atendimento</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
