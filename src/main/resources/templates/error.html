<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments :: menu}"></header>
<main class="conteudo" th:switch="${status}">
    <th:block th:case="403">
        <h1>Acesso negado</h1>
        <p class="subtitulo">Seu perfil não tem permissão para acessar esta página.</p>
    </th:block>
    <th:block th:case="404">
        <h1>Página não encontrada</h1>
        <p class="subtitulo">O endereço não existe ou não está disponível para você.</p>
    </th:block>
    <th:block th:case="*">
        <h1>Algo deu errado</h1>
        <p class="subtitulo">Não foi possível concluir a operação. Tente novamente.</p>
    </th:block>
    <p><a class="botao" th:href="@{/}">Voltar ao início</a></p>
</main>
</body>
</html>
