<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar pet · Clyvo Vet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="topo"></header>
<main class="conteudo">
    <div id="avisos"></div>

    <div class="titulo-pagina">
        <h1 id="titulo">Cadastrar pet</h1>
    </div>

    <form class="formulario" id="formulario">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="60">
        <p class="erro-campo" data-erro="nome"></p>

        <label for="especie">Espécie</label>
        <select id="especie" name="especie" data-opcoes="CAO,GATO"></select>
        <p class="erro-campo" data-erro="especie"></p>

        <label for="raca">Raça</label>
        <input type="text" id="raca" name="raca" maxlength="60">
        <p class="erro-campo" data-erro="raca"></p>

        <label for="dataNascimento">Data de nascimento</label>
        <input type="date" id="dataNascimento" name="dataNascimento">
        <p class="erro-campo" data-erro="dataNascimento"></p>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-secundario" href="pets.html">Cancelar</a>
        </div>
    </form>
</main>
<script src="js/app.js"></script>
<script src="js/pet-form.js"></script>
</body>
</html>
