<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Clyvo Vet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">
<main class="cartao-login">
    <h1 class="marca">Clyvo Vet</h1>
    <p class="subtitulo">Acompanhamento contínuo da saúde do seu pet.</p>

    <div id="avisos"></div>

    <form class="formulario" id="formulario">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" autofocus>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password">

        <div class="acoes-formulario">
            <button type="submit" class="botao">Entrar</button>
        </div>
    </form>
</main>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
